name: Daily COE pipeline + alert

# Runs the data pipeline once a day and notifies on actionable changes.
# Telegram alerts are optional: set the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
# repository secrets to enable them. Without those secrets the notify step runs
# in log-only mode (it prints what it would have sent and exits cleanly).

on:
  schedule:
    - cron: "0 1 * * *"   # 09:00 SGT (01:00 UTC) daily
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python3 run_pipeline.py

      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 outputs/notify.py
